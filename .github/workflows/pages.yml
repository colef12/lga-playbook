# Publishes both versions of the Playbook to GitHub Pages, each with its playbook-core:
#   main -> https://colef12.github.io/lga-playbook/
#   lab  -> https://colef12.github.io/lga-playbook/lab/
# Runs when main changes, when the lab branch reports a change
# (lab-updated.yml on the lab branch), or by hand from the Actions tab.
name: Publish Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Lab updated"]
    types: [completed]
    branches: [lab]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Get lab
        uses: actions/checkout@v4
        with:
          ref: lab
          path: site/lab
      # Shared engine (colef12/playbook-core): stable core for /, lab core for /lab/
      - name: Get core (stable)
        uses: actions/checkout@v4
        with:
          repository: colef12/playbook-core
          ref: main
          path: site/core
      - name: Get core (lab)
        uses: actions/checkout@v4
        with:
          repository: colef12/playbook-core
          ref: lab
          path: site/lab/core
      - name: Remove repo-only files
        run: rm -rf site/.git site/.github site/lab/.git site/lab/.github site/core/.git site/lab/core/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
